name: Deploy to DigitalOcean

on:
    push:
        branches:
            - main

    workflow_dispatch:

# Only one deploy runs at a time. A new push waits for the running deploy.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    # 1. Check the code before the deploy. A failed check stops the deploy.
    check:
        name: Type check and build
        runs-on: ubuntu-22.04

        steps:
            - name: Check out the code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Type check
              run: yarn typecheck

            - name: Build
              run: yarn build

    deploy:
        name: Deploy application
        needs: check
        runs-on: ubuntu-22.04

        steps:
            # 2. Setup SSH Variables
            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
                  DO_HOST: ${{ secrets.DO_HOST }}
                  DO_PORT: ${{ secrets.DO_PORT }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key

                  ssh-keyscan -p "$DO_PORT" "$DO_HOST" >> ~/.ssh/known_hosts

            # 3. Connect to DigitalOcean and deploy
            - name: Deploy application
              env:
                  DO_HOST: ${{ secrets.DO_HOST }}
                  DO_USERNAME: ${{ secrets.DO_USERNAME }}
                  DO_PORT: ${{ secrets.DO_PORT }}
              run: |
                  ssh -i ~/.ssh/deploy_key \
                    -p "$DO_PORT" \
                    "$DO_USERNAME@$DO_HOST" << 'EOF'

                    set -e

                    cd /var/www/blackcat_adventures_front_end/

                    echo "Pulling latest changes..."
                    git pull --ff-only origin main

                    # Clear the cache BEFORE the restart, so that the new
                    # server process does not serve old cached pages.
                    rm -rf .next/standalone/.next/server/route-cache/
                    echo "Cache cleared!"

                    echo "Restarting Next.js application..."
                    pm2 restart blackcat-adventures

                    echo "Deployment completed successfully!"
                  EOF

            # 4. Clean up SSH private key
            - name: Cleanup SSH
              if: always()
              run: |
                  rm -f ~/.ssh/deploy_key
